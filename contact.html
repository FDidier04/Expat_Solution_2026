<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Contactez ExpatSolutions simplement par téléphone, email ou formulaire.">
  <title>Contact | ExpatSolutions</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: #09203d;
      background: #f7f9fc;
      font-family: "DM Sans", Arial, sans-serif;
    }
    header {
      padding: 24px clamp(20px, 6vw, 72px);
      background: #fff;
      border-bottom: 1px solid #e4e8ee;
    }
    header a {
      display: inline-flex;
      align-items: center;
      color: inherit;
      text-decoration: none;
      font-weight: 700;
    }
    header img {
      width: 150px;
      height: 50px;
      object-fit: contain;
    }
    main {
      width: min(980px, calc(100% - 40px));
      margin: 0 auto;
      padding: 56px 0;
      display: grid;
      grid-template-columns: .9fr 1.1fr;
      gap: 42px;
      align-items: start;
    }
    h1 {
      margin: 0 0 18px;
      font: 700 clamp(34px, 5vw, 52px)/1.08 "Manrope", Arial, sans-serif;
      letter-spacing: -1.5px;
    }
    p {
      margin: 0;
      color: #637287;
      line-height: 1.75;
    }
    .details {
      margin-top: 30px;
      display: grid;
      gap: 12px;
    }
    .details a {
      width: fit-content;
      color: #0b65d8;
      font-weight: 700;
      text-decoration: none;
      border-bottom: 1px solid currentColor;
      padding-bottom: 3px;
    }
    form {
      padding: 28px;
      background: #fff;
      border: 1px solid #dbe4ee;
      border-radius: 8px;
      box-shadow: 0 16px 40px rgba(6, 29, 59, .08);
    }
    label {
      display: grid;
      gap: 8px;
      margin-bottom: 16px;
      font-weight: 600;
    }
    input,
    textarea {
      width: 100%;
      border: 1px solid #cfd8e3;
      border-radius: 6px;
      padding: 12px 14px;
      color: #09203d;
      font: 15px "DM Sans", Arial, sans-serif;
      background: #fff;
    }
    textarea {
      min-height: 130px;
      resize: vertical;
    }
    button {
      border: 0;
      border-radius: 6px;
      padding: 13px 22px;
      color: #fff;
      background: #0b65d8;
      font: 700 15px "DM Sans", Arial, sans-serif;
      cursor: pointer;
    }
    .back {
      margin-top: 24px;
      display: inline-block;
      color: #0b65d8;
      font-weight: 700;
      text-decoration: none;
    }
    @media (max-width: 760px) {
      main {
        grid-template-columns: 1fr;
        padding: 36px 0;
      }
      form {
        padding: 22px;
      }
    }
  </style>
</head>
<body>
  <header>
    <a href="index.html" aria-label="Retour à l'accueil">
      <img src="assets/logo-expat-solutions.png" alt="ExpatSolutions">
    </a>
  </header>

  <main>
    <section>
      <h1>Contactez-nous</h1>
      <p>Expliquez-nous simplement votre besoin. Nous reviendrons vers vous pour organiser un premier échange.</p>

      <div class="details" aria-label="Coordonnées">
        <a href="tel:+242066479724">+242 06 647 9724</a>
        <a href="tel:+33749145995">+33 7 49 14 59 95</a>
        <a href="mailto:contact@expatsolutions.com">contact@expatsolutions.com</a>
      </div>

      <a class="back" href="index.html">Retour à l'accueil</a>
    </section>

    <form action="mailto:contact@expatsolutions.com" method="post" enctype="text/plain">
      <label>
        Nom complet
        <input type="text" name="nom" placeholder="Votre nom" required>
      </label>
      <label>
        Email
        <input type="email" name="email" placeholder="votre.email@exemple.com" required>
      </label>
      <label>
        Téléphone
        <input type="tel" name="telephone" placeholder="+33..." required>
      </label>
      <label>
        Message
        <textarea name="message" placeholder="Décrivez votre demande en quelques mots" required></textarea>
      </label>
      <button type="submit">Envoyer</button>
    </form>
  </main>
</body>
</html>
